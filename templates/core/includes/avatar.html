{% if person.profile.photo %}<img class="avatar avatar-{{ size|default:'sm' }}" src="{{ person.profile.photo.url }}" alt="Profile picture of {% firstof person.get_full_name person.username %}">{% else %}<span class="avatar avatar-{{ size|default:'sm' }} avatar-initial" aria-hidden="true">{{ person.first_name|default:person.username|slice:":1"|upper }}</span>{% endif %}
