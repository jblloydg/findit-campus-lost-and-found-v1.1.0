{% with p=person.profile %}{% if p.flagged_at %}<span class="subtle-chip account-suspended" title="{{ p.flag_reason }}">⚑ Red flag</span>{% elif p.role == "student" %}{% if p.email_verified_at %}<span class="verified-badge">✔ Verified</span>{% else %}<span class="unverified-badge">Not verified</span>{% endif %}{% else %}<span class="muted">—</span>{% endif %}{% if p.id_conflict_deadline %} <span class="subtle-chip report-status-submitted" title="Another account verified this Student ID">ID conflict</span>{% endif %}{% endwith %}
