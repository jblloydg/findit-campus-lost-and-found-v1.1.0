{% with a=message.attachment %}{% if a and a.status == "READY" %}{% if a.kind == "PHOTO" %}<a class="chat-media" href="{% url 'chat-media' a.pk 'file' %}" target="_blank" rel="noopener"><img src="{% url 'chat-media' a.pk 'preview' %}" width="{{ a.width }}" height="{{ a.height }}" loading="lazy" decoding="async" alt="Photo sent in the chat"></a>{% else %}<span class="chat-media-wrap"><video class="chat-media" controls preload="none" playsinline width="{{ a.width }}" height="{{ a.height }}"{% if a.preview %} poster="{% url 'chat-media' a.pk 'preview' %}"{% endif %} src="{% url 'chat-media' a.pk 'file' %}"></video><span class="media-badge">▶ {{ a.duration_label }} · {{ a.stored_bytes|filesizeformat }}</span></span>{% endif %}{% endif %}{% endwith %}
