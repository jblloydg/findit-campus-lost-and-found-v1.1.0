{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages">
  {% if page_obj.has_previous %}<a class="button button-outline button-small" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Previous</a>{% else %}<span class="button button-outline button-small is-disabled" aria-disabled="true">← Previous</span>{% endif %}
  <span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} total</span>
  {% if page_obj.has_next %}<a class="button button-outline button-small" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next →</a>{% else %}<span class="button button-outline button-small is-disabled" aria-disabled="true">Next →</span>{% endif %}
</nav>
{% endif %}
